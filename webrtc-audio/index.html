<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ProxiSpeak — Two-Peer Audio</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px;
      background: #eef3f7;
      color: #183044;
      font-family: Arial, sans-serif;
    }

    main {
      max-width: 680px;
      margin: 30px auto;
      padding: 28px;
      background: white;
      border-radius: 16px;
    }

    p { line-height: 1.6; }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 20px 0;
    }

    button {
      padding: 12px 16px;
      background: #175b85;
      color: white;
      border: 0;
      border-radius: 8px;
      font: inherit;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    button:focus-visible {
      outline: 3px solid #d89618;
      outline-offset: 3px;
    }

    #status {
      padding: 14px;
      background: #eef3f7;
      border-radius: 8px;
    }

    audio { width: 100%; }

    pre {
      padding: 14px;
      background: #142a38;
      color: #d9f1e7;
      border-radius: 8px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      max-height: 250px;
      overflow-y: auto;
      font-size: 12px;
    }
  </style>
</head>

<body>
  <main>
    <h1>ProxiSpeak Audio Lab</h1>
    <p>Open this page in two tabs. Start audio in each tab.</p>

    <p>Signaling: <strong id="signaling">Connecting…</strong></p>
    <p id="status" role="status" aria-live="polite">Microphone is off.</p>

    <div class="controls">
      <button id="start" disabled>Start audio</button>
      <button id="mute" disabled>Mute microphone</button>
      <button id="stop" disabled>Stop session</button>
    </div>

    <h2>Received audio</h2>
    <p>
      Use headphones. If playback does not start automatically,
      press Play below.
    </p>

    <audio id="remoteAudio" autoplay controls></audio>

    <h2>Connection log</h2>
    <pre id="log" aria-label="Connection log"></pre>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/client.js"></script>
</body>
</html>
